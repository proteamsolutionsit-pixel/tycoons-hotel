# Portable MySQL 8.4 for local development of The Tycoons Hotel.
# basedir / datadir / log-error are NOT set here: mysqld resolves relative
# paths inconsistently (against basedir during --initialize, against the
# working directory at runtime), so scripts/mysql-*.ps1 pass absolute paths.
[mysqld]
port=3308
bind-address=127.0.0.1
mysqlx=OFF
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci
default-time-zone=+00:00
max_allowed_packet=32M
# Lets the schema owner create the audit_logs triggers while binary logging is on (dev server only)
log_bin_trust_function_creators=1
sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION

[client]
port=3308
host=127.0.0.1
default-character-set=utf8mb4
