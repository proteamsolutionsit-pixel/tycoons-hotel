name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password  # pragma: allowlist secret (throwaway CI container)
          MYSQL_DATABASE: tycoons_test
          MYSQL_USER: tycoons
          MYSQL_PASSWORD: ci-password  # pragma: allowlist secret (throwaway CI container)
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-retries=20
        ports: ["3306:3306"]
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: mysql+pymysql://tycoons:ci-password@127.0.0.1:3306/tycoons_test?charset=utf8mb4  # pragma: allowlist secret (throwaway CI container)
      DATABASE_URL: mysql+pymysql://tycoons:ci-password@127.0.0.1:3306/tycoons_test?charset=utf8mb4  # pragma: allowlist secret (throwaway CI container)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Allow trigger creation (CI database only)
        run: mysql -h 127.0.0.1 -uroot -pci-root-password -e "SET GLOBAL log_bin_trust_function_creators=1;"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy
      - run: pip-audit -r requirements-dev.txt --progress-spinner off
      - run: python -m pytest -q
      - name: Secret scan (audited exceptions carry an inline pragma)
        working-directory: .
        run: git ls-files | grep -vE 'package-lock.json|\.(png|jpg|woff2)$|the-tycoons-hotel.html' | xargs detect-secrets-hook

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npx vitest run
      - run: npx vite build
