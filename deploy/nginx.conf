# /etc/nginx/sites-available/tycoons  - production reverse proxy (example)
# React build served as static files; /api and /media proxied to uvicorn.

# Allow only these Host headers (anything else gets 444)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name thetycoonshotel.example www.thetycoonshotel.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name thetycoonshotel.example www.thetycoonshotel.example;

    ssl_certificate     /etc/letsencrypt/live/thetycoonshotel.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thetycoonshotel.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Security headers for the site (the API adds its own as well).
    # CSP verified against the production build with zero violations; the Razorpay
    # entries cover Checkout (script, iframe, telemetry). Tested values: deploy/csp.txt.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /srv/tycoons/frontend/dist;
    # The API enforces its own limits (1 MB JSON, 9 MB uploads); keep nginx just above.
    client_max_body_size 10m;
    client_body_timeout 30s;

    # Hashed build assets and site images: cache hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    # Readiness is for the load balancer / monitoring, not the public
    location = /api/v1/health/ready { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8000; }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
    }

    # Client-side routes (/rooms, /booking/TYC..., /admin/...) fall back to the SPA
    location / {
        try_files $uri /index.html;
    }
}
