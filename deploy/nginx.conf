# /etc/nginx/sites-available/tycoons  — production reverse proxy (example)
# React build served as static files; /api and /media proxied to uvicorn.

server {
    listen 80;
    server_name thetycoonshotel.example www.thetycoonshotel.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thetycoonshotel.example www.thetycoonshotel.example;

    ssl_certificate     /etc/letsencrypt/live/thetycoonshotel.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thetycoonshotel.example/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /srv/tycoons/frontend/dist;
    client_max_body_size 10m;          # CV uploads are capped at 5 MB by the API

    # Hashed build assets and site images: cache hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
    }

    # Client-side routes (/rooms, /booking/TYC..., /admin/...) fall back to the SPA
    location / {
        try_files $uri /index.html;
    }
}
